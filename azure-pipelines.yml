trigger: none
pool: practice-pool
stages:

- stage: ci
  jobs:
    - job: installandbuild
      displayName: npm install and build
      steps:    
        # - task: PowerShell@2
        #   displayName: biome
        #   continueOnError: true
        #   inputs:
        #     targetType: 'inline'
        #     script: |
        #       npm install --save-dev --save-exact @biomejs/biome
        #       # format files
        #       npx @biomejs/biome format --write
              
        #       # lint files and apply the safe fixes
        #       npx @biomejs/biome lint --write
              
        #       # run format, lint, etc. and apply the safe fixes
        #       npx @biomejs/biome check --write
              
        #       # check all files against format, lint, etc. in CI environments
        #       npx @biomejs/biome ci
        - task: PowerShell@2
          displayName: npminstall
          continueOnError: true
          inputs:
            targetType: 'inline'
            script: 'npm run build'

    - job: copyfiles
      displayName: copy files
      pool: practice-pool
      dependsOn: installandbuild
      steps:
      - task: CopyFiles@2
        displayName: 'copy build to staging directory'
        inputs:
          SourceFolder: 'build'
          Contents: '**'
          TargetFolder: '$(build.ArtifactStagingDirectory)'
    
      - task: PublishPipelineArtifact@1
        displayName: 'publish react artifact'
        inputs:
          targetPath: '$(build.ArtifactStagingDirectory)'
          artifact: 'build'
          publishLocation: 'pipeline'

- stage: cdpipe
  displayName: CD via SSH
  jobs:
  - deployment: deployreact
    displayName: Deploy React to VM
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          # 1️⃣ Download pipeline artifact
          - download: current
            artifact: build

          # 2️⃣ Copy files to VM
          - task: CopyFilesOverSSH@0
            displayName: Copy React build to VM
            inputs:
              sshEndpoint: 'react-sc'
              sourceFolder: '$(Pipeline.Workspace)/build'
              contents: '**'
              targetFolder: '/home/azureuser/build'
              cleanTargetFolder: true
              readyTimeout: '20000'

          # 3️⃣ Permission + restart nginx
          - task: SSH@0
            displayName: Restart Nginx
            inputs:
              sshEndpoint: 'react-sc'
              runOptions: 'inline'
              inline: |
                sudo apt update
                sudo apt install nginx -y
                sudo rm -rf /var/www/html/*
                sudo cp -r /home/azureuser/build/* /var/www/html/
                sudo chown -R www-data:www-data /var/www/html
                sudo systemctl restart nginx
              readyTimeout: '20000'