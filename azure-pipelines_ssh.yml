- stage: cdpipe
  displayName: CD via SSH
  jobs:
  - deployment: deployreact
    displayName: Deploy React to VM
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          # 1️⃣ Download pipeline artifact
          - download: current
            artifact: build

          # 2️⃣ Copy files to VM
          - task: CopyFilesOverSSH@0
            displayName: Copy React build to VM
            inputs:
              sshEndpoint: 'ssh-sc'
              sourceFolder: '$(Pipeline.Workspace)/build'
              contents: '**'
              # targetFolder: '/home/azureuser/build'
              targetFolder: '/tmp/build'
              cleanTargetFolder: true
              readyTimeout: '20000'

          # 3️⃣ Permission + restart nginx
          - task: SSH@0
            displayName: Restart Nginx
            inputs:
              sshEndpoint: 'ssh-sc'
              runOptions: 'inline'
              inline: |
                set -e
                      echo "Checking nginx installation..."
                
                      if ! command -v nginx >/dev/null 2>&1; then
                        echo "Nginx not found. Installing..."
                        sudo apt-get update -y
                        sudo DEBIAN_FRONTEND=noninteractive sudo apt-get install -y nginx
                      else
                        echo "Nginx already installed. Skipping install."
                      fi
                
                      echo "Deploying React build..."
                
                      sudo mkdir -p /var/www/html
                      sudo rm -rf /var/www/html/*
                      sudo cp -r /tmp/build/* /var/www/html/
                
                      sudo chown -R www-data:www-data /var/www/html
                      sudo chmod -R 755 /var/www/html
                
                      echo "Restarting nginx..."
                      sudo systemctl restart nginx
                      sudo systemctl status nginx --no-pager
              readyTimeout: '20000'