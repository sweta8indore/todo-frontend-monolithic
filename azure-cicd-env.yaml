trigger: 
  branches:
   include:
     - master
pool: practice-pool
stages:

- stage: ci
  jobs:
    - job: installandbuild
      displayName: npm install and build
      steps:    
        # - task: PowerShell@2
        #   displayName: biome
        #   continueOnError: true
        #   inputs:
        #     targetType: 'inline'
        #     script: |
        #       npm install --save-dev --save-exact @biomejs/biome
        #       # format files
        #       npx @biomejs/biome format --write
              
        #       # lint files and apply the safe fixes
        #       npx @biomejs/biome lint --write
              
        #       # run format, lint, etc. and apply the safe fixes
        #       npx @biomejs/biome check --write
              
        #       # check all files against format, lint, etc. in CI environments
        # #       npx @biomejs/biome ci
        # - task: PowerShell@2
        #   displayName: npminstall
        #   continueOnError: true
        #   inputs:
        #     targetType: 'inline'
        #     script: 'npm run build'    
        # 1️⃣ Use correct Node version
        - task: NodeTool@0
          displayName: Use Node.js
          inputs:
            versionSpec: '18.x'

        # 2️⃣ Install dependencies
        - task: PowerShell@2
          displayName: npm install
          inputs:
            targetType: 'inline'
            script: |
              npm install

        # 3️⃣ Build React app
        - task: PowerShell@2
          displayName: npm run build
          inputs:
            targetType: 'inline'
            script: |
              npm run build

    - job: copyfiles
      displayName: copy files
      pool: practice-pool
      dependsOn: installandbuild
      steps:
      - task: CopyFiles@2
        displayName: 'copy build to staging directory'
        inputs:
          SourceFolder: 'build'
          Contents: '**'
          TargetFolder: '$(build.ArtifactStagingDirectory)'
    
      - task: PublishPipelineArtifact@1
        displayName: 'publish react artifact'
        inputs:
          targetPath: '$(build.ArtifactStagingDirectory)'
          artifact: 'build'
          publishLocation: 'pipeline'

- stage: cdpipe
  displayName: CD via environment
  jobs:
  - deployment: deployreact
    displayName: Deploy React to VM
    environment:
      name: production
      resourceType: VirtualMachine
      resourceName: frontend-vm
    strategy:
      runOnce:
        deploy:
          steps:

          # 1️⃣ Download pipeline artifact
          - download: current
            artifact: build

          # 2️⃣ Deploy locally on VM (agent is already there)
          - script: |
              set -e

              echo "Checking nginx..."
              if ! command -v nginx >/dev/null 2>&1; then
                echo "Installing nginx..."
                sudo apt-get update -y
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
              fi

              echo "Deploying React build..."
              sudo mkdir -p /var/www/html
              sudo rm -rf /var/www/html/*
              sudo cp -r $(Pipeline.Workspace)/build/* /var/www/html/

              sudo chown -R www-data:www-data /var/www/html
              sudo chmod -R 755 /var/www/html

              sudo systemctl restart nginx
              sudo systemctl is-active nginx
            displayName: Deploy & Restart Nginx